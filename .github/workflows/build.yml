name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Lista zmian: sekcja „## next” dostaje numer tej wersji i datę (trafia do aplikacji i do opisu wydania)
      - name: Changelog
        run: |
          MAJOR=$(grep "^connectVersion=" gradle.properties | cut -d= -f2)
          BASE=$(grep "^connectBase=" gradle.properties | cut -d= -f2)
          VER="$MAJOR.$((BUILD_NUMBER - BASE))"
          CL=app/src/main/assets/changelog.txt
          if grep -q "^## next$" "$CL"; then
            sed -i "s/^## next$/## $VER · $(date +%F)/" "$CL"
            echo "CL_CHANGED=1" >> "$GITHUB_ENV"
          fi
          awk -v v="## $VER " 'index($0, v)==1 {f=1; next} /^## /{f=0} f' "$CL" | sed '/^#/d' > notes.md
          if [ ! -s notes.md ]; then
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$PREV" ]; then git log --no-merges --pretty='%B' "$PREV..HEAD"; else git log -1 --pretty='%B'; fi \
              | grep -vE '^(Co-Authored-By|Claude-Session|https://claude\.ai)' | cat -s | head -c 3000 > notes.md || true
          fi
          cat notes.md

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; then
            { grep -E "^e: " build.log; awk '/What went wrong/{f=1} /\* Try:/{f=0} f' build.log; grep -iE "^ERROR:|AAPT: error" build.log; } | grep -v "^\s*$" | head -45 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          mkdir -p out
          MAJOR=$(grep "^connectVersion=" gradle.properties | cut -d= -f2)
          BASE=$(grep "^connectBase=" gradle.properties | cut -d= -f2)
          VER="$MAJOR.$((BUILD_NUMBER - BASE))"
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "out/CarOS-Connect-$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CarOS-Connect-apk
          path: out/*.apk

      # Każdy build na main = nowe wydanie. Aplikacja sprawdza /releases/latest i aktualizuje się online.
      # Tag kończy się numerem builda (= versionCode) – po nim aplikacja poznaje, że jest nowsza wersja.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VER}-b${BUILD_NUMBER}" out/*.apk \
            --title "CAR OS Connect ${VER}" \
            --notes-file notes.md \
            --latest

      # Numer wersji wpisany w liście zmian zapisujemy z powrotem w repozytorium
      - name: Save changelog
        if: env.CL_CHANGED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/changelog.txt
          git commit -m "Lista zmian: wersja ${VER} [skip ci]" || exit 0
          git push origin HEAD:main || echo "::warning::Nie udało się zapisać listy zmian (nowszy commit na main)"
